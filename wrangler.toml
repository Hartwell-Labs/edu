name = "hartwell-edu"
compatibility_date = "2026-10-01"
account_id = "29ee063c29d9e8f27a8863fadcaa9073"
main = "src/index.js"

routes = [
  { pattern = "edu.hartwell-labs.pl", zone_name = "hartwell-labs.pl" },
  { pattern = "edu.hartwell-labs.pl/*", zone_name = "hartwell-labs.pl" },
]

[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
run_worker_first = true

# Konta uczniów i ich postęp. Osobna baza od licencji Talusa — mieszanie
# danych edukacyjnych z licencyjnymi byłoby błędem na poziomie architektury.
[[d1_databases]]
binding = "DB"
database_name = "anvil"
database_id = "45975b33-8759-475a-bb69-7735a849961f"
